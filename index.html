<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRODUCCIÓN -->
    <section class="intro">

        <div class="intro-content">

            <div class="lily" id="lily">
                <div class="lily-center"></div>

                <div class="petal petal-1"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-6"></div>

                <div class="stem"></div>
            </div>

            <p class="intro-text">
                Esta vez te quiero regalar algo que dure,
                desde el fondo de mi corazón
            </p>

            <div class="scroll-indicator">
                ↓
            </div>

        </div>

    </section>


    <!-- ESPACIO DE ANIMACIÓN -->
    <section class="journey">

        <div class="falling-lily" id="fallingLily">

            <div class="lily-small">
                <div class="lily-center"></div>

                <div class="petal petal-1"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-6"></div>
            </div>

            <div class="falling-stem"></div>

        </div>

    </section>


    <!-- FLORERO -->
    <section class="bouquet-section">

        <div class="bouquet">

            <!-- Flores -->
            <div class="flower flower-1">🌼</div>
            <div class="flower flower-2">🌻</div>
            <div class="flower flower-3">🌼</div>
            <div class="flower flower-4">🌷</div>
            <div class="flower flower-5">🌼</div>
            <div class="flower flower-6">🌻</div>
            <div class="flower flower-7">🌼</div>

            <!-- Hojas -->
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
            <div class="leaf leaf-4"></div>

            <!-- Florero -->
            <div class="vase">

                <div class="vase-opening"></div>

                <div class="vase-body"></div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
